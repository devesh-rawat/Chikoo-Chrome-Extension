<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chikoo — Your Personal New Tab</title>

  <!-- Modern Fonts (Henny Penny for English, Jaini for Hindi) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Jaini&family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Base + active theme -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" id="theme-stylesheet" href="css/themes/minimalistic-dark.css" />

  <!-- Component stylesheets -->
  <link rel="stylesheet" href="css/components/search.css" />
  <link rel="stylesheet" href="css/components/clock.css" />
  <link rel="stylesheet" href="css/components/greeting.css" />
  <link rel="stylesheet" href="css/components/quicklinks.css" />
  <link rel="stylesheet" href="css/components/stickynotes.css" />
  <link rel="stylesheet" href="css/components/widgets.css" />
  <link rel="stylesheet" href="css/components/calendar.css" />
  <link rel="stylesheet" href="css/components/bookmarks.css" />
  <link rel="stylesheet" href="css/components/settings-panel.css" />
</head>
<body data-mode="minimalistic" data-dark="true">

  <!-- Background glow layer -->
  <div id="bg-layer" class="bg-layer">
    <div class="chikoo-glow chikoo-glow-1"></div>
    <div class="chikoo-glow chikoo-glow-2"></div>
    <div class="chikoo-glow chikoo-glow-3"></div>
  </div>

  <div id="app" class="app-shell">

    <!-- Top Navigation Header -->
    <header class="top-nav-bar">
      <div class="brand-badge">
        <img src="assets/logo.svg" alt="Chikoo Mascot" class="brand-logo" width="36" height="36" />
        <span class="brand-title">Chik<span class="chikoo-goggles-wrap"><span class="goggle-lens lens-left">o</span><span class="goggle-bridge"></span><span class="goggle-lens lens-right">o</span></span></span>
      </div>

      <div class="top-nav-actions">
        <!-- Layout Mode Toggle -->
        <div class="mode-toggle" id="mode-toggle">
          <button class="mode-btn active" id="btn-minimalistic" data-mode="minimalistic">Minimal</button>
          <button class="mode-btn"        id="btn-work"          data-mode="work">Work Hub</button>
        </div>

        <!-- Dark/Light Theme Toggle -->
        <button id="btn-light-dark" class="top-nav-btn" title="Toggle dark/light theme">
          <span id="light-dark-icon">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span id="light-dark-label">Dark</span>
        </button>

        <!-- Quick Weather Badge -->
        <button type="button" id="top-weather-badge" class="top-weather-badge" title="Live Weather">
          <span class="tw-icon">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
          </span>
          <span class="tw-temp">--°C</span>
        </button>

        <!-- Settings Button -->
        <button id="btn-settings-trigger" class="top-nav-btn icon-only" title="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ══════════════════════════════════════════════════
         MINIMALISTIC LAYOUT
         3-col: sidebar | clock+search+notes | greeting+board
         ══════════════════════════════════════════════════ -->
    <main id="layout-minimalistic" class="layout-panel page-grid-minimal">

      <!-- LEFT: vertical quick links sidebar -->
      <aside class="col-sidebar-min" id="col-sidebar">
        <div id="slot-quicklinks" class="slot"></div>
      </aside>

      <!-- CENTER: clock + search + sticky creator -->
      <div class="col-center-min">
        <div id="slot-clock"        class="slot slot-clock"></div>
        <div id="slot-search-min"   class="slot slot-search"></div>
        <div id="slot-note-creator" class="slot slot-note-creator"></div>
      </div>

      <!-- RIGHT: greeting card + sticky board -->
      <div class="col-right-min">
        <div id="slot-greeting" class="slot slot-greeting-card"></div>
      </div>

    </main>

    <!-- ══════════════════════════════════════════════════
         WORK LAYOUT
         3-col: history | search+widgets | todo
         ══════════════════════════════════════════════════ -->
    <main id="layout-work" class="layout-panel page-grid-work">

      <!-- LEFT: Bookmarks Hub & Quick Add -->
      <aside class="col-left-work">
        <div class="panel-card" id="slot-bookmarks">
          <!-- Filled by BookmarksComponent -->
        </div>
      </aside>

      <!-- CENTER: search bar + widget tabs + widget display -->
      <div class="col-center-work">
        <div id="slot-search-work" class="slot-search"></div>

        <div class="widget-area">
          <div class="widget-display" id="widget-display"></div>
        </div>
      </div>

      <!-- RIGHT: Study & Holiday Calendar -->
      <aside class="col-right-work">
        <div class="panel-card" id="slot-calendar">
          <!-- Filled by CalendarComponent -->
        </div>
      </aside>

    </main>



  </div>

  <!-- Settings Slide-over Panel -->
  <div id="settings-panel" class="settings-panel hidden"></div>
  <div id="settings-overlay" class="settings-overlay hidden"></div>

  <!-- Quick Links Modal -->
  <div id="quicklinks-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Quick Link</h3>
        <button class="modal-close" id="ql-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <label>Title</label>
        <input type="text" id="ql-input-label" placeholder="e.g. YouTube, GitHub" />
        <label>URL</label>
        <input type="text" id="ql-input-url" placeholder="https://..." />
      </div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" id="ql-modal-cancel">Cancel</button>
        <button class="modal-btn-save" id="ql-modal-save">Add Shortcut</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/weather-service.js"></script>

  <!-- Minimalistic mode components -->
  <script src="js/components/clock.js"></script>
  <script src="js/components/search.js"></script>
  <script src="js/components/greeting.js"></script>
  <script src="js/components/quicklinks.js"></script>
  <script src="js/components/stickynotes.js"></script>

  <!-- Work mode components -->
  <script src="js/components/widgets.js"></script>
  <script src="js/components/calendar.js"></script>
  <script src="js/components/bookmarks.js"></script>
  <script src="js/components/settings-panel.js"></script>

  <script src="js/newtab.js"></script>
</body>
</html>
