<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chikoo - Nephew Mascot">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chikoo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Face Skin Gradient -->
    <linearGradient id="chikoo-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Cap/Hair Gradient -->
    <linearGradient id="chikoo-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glass Badge Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#chikoo-bg)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Orbit Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Cool Snapback Cap Visor -->
  <path d="M 15,25 C 22,22 30,21 41,23 C 47,24 50,26 50,26 C 50,26 41,27 32,27 C 23,27 15,25 15,25 Z" fill="#0284c7"/>

  <!-- Cap Crown -->
  <path d="M 18,26 C 18,15 25,10 32,10 C 39,10 46,15 46,26 Z" fill="url(#chikoo-cap)"/>

  <!-- Cute Face -->
  <circle cx="32" cy="34" r="13" fill="#fde047"/>

  <!-- Cheerful Eyes -->
  <circle cx="27" cy="33" r="2.2" fill="#1e293b"/>
  <circle cx="37" cy="33" r="2.2" fill="#1e293b"/>
  <circle cx="28" cy="32" r="0.8" fill="#ffffff"/>
  <circle cx="38" cy="32" r="0.8" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="24" cy="37" r="2" fill="#f43f5e" opacity="0.5"/>
  <circle cx="40" cy="37" r="2" fill="#f43f5e" opacity="0.5"/>

  <!-- Big Happy Smile -->
  <path d="M 27,37 Q 32,43 37,37" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Hero Star Badge on Chest -->
  <path d="M 32,48 L 33.5,51 L 37,51.2 L 34.3,53.5 L 35.2,57 L 32,55 L 28.8,57 L 29.7,53.5 L 27,51.2 L 30.5,51 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>

  <!-- Sparkle Star Top Right -->
  <path d="M 48,11 L 49.2,13.5 L 52,14 L 49.8,15.8 L 50.5,18.5 L 48,17 L 45.5,18.5 L 46.2,15.8 L 44,14 L 46.8,13.5 Z" fill="#fef08a" filter="url(#glow)"/>
</svg>
