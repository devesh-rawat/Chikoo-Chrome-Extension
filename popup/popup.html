<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Modern Fonts (Henny Penny & Jaini) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Jaini&family=Space+Mono&family=Syne:wght@700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" id="theme-stylesheet" href="../css/themes/minimalistic-dark.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="popup-app" class="popup-app">
    <div class="popup-header">
      <img src="../assets/logo.svg" alt="" class="popup-logo-img" width="28" height="28" />
      <span class="popup-title">Chikoo</span>
    </div>

    <!-- Mode switcher -->
    <div class="popup-section">
      <div class="popup-label">Page Mode</div>
      <div class="mode-toggle" id="popup-mode-toggle">
        <button class="mode-btn active" id="popup-btn-minimalistic" data-mode="minimalistic">🌿 Minimal</button>
        <button class="mode-btn" id="popup-btn-work" data-mode="work">💼 Work</button>
      </div>
    </div>

    <!-- Light / Dark -->
    <div class="popup-section">
      <div class="settings-toggle-row">
        <span>Dark Mode</span>
        <label class="toggle-switch">
          <input type="checkbox" id="popup-dark-toggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Quick Bookmark -->
    <div class="popup-section" id="popup-bookmark-section">
      <div class="popup-label">Quick Bookmark</div>
      <div class="popup-bm-card" id="popup-bm-card">
        <div class="popup-bm-info">
          <img id="popup-bm-fav" class="popup-bm-fav" src="" alt="" style="display:none;" />
          <div class="popup-bm-text">
            <span class="popup-bm-title" id="popup-bm-title">Detecting active tab…</span>
            <span class="popup-bm-url" id="popup-bm-url"></span>
          </div>
        </div>
        <div class="popup-bm-edit-wrap hidden" id="popup-bm-edit-wrap">
          <input type="text" class="popup-bm-edit-input" id="popup-bm-edit-input" placeholder="Edit bookmark name" />
          <button class="popup-bm-edit-save-btn" id="popup-btn-edit-save" title="Save name">Rename</button>
        </div>
        <button class="popup-bm-btn" id="popup-btn-bookmark" disabled>
          <span class="popup-bm-btn-icon">🔖</span>
          <span class="popup-bm-btn-label">Bookmark Tab</span>
        </button>
      </div>
      <div id="popup-bm-status" class="popup-bm-status hidden"></div>
    </div>

    <!-- Open new tab link -->
    <div class="popup-footer">
      <a href="../newtab.html" target="_blank" class="popup-link">Open New Tab →</a>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/theme-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
